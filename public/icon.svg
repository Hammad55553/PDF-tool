      <stop offset="0%" stop-color="#3A42EA" />
      <stop offset="100%" stop-color="#7379FF" />
    </linearGradient>
    <linearGradient id="doc-grad" x1="140" y1="90" x2="370" y2="420" gradientUnits="userSpaceOnUse">
