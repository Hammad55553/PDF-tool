    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E237A" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="115" fill="url(#bg-grad)" />
  
  <g filter="url(#shadow)">
